<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Modifier le Medicament' : 'Nouveau Medicament'}">Formulaire Medicament</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; padding: 30px 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; font-weight: 500; color: #334155; }
        .form-control { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; font-family: inherit; }
        .btn-group { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
        .btn { padding: 9px 16px; border-radius: 6px; font-size: 0.875rem; font-weight: 500; cursor: pointer; text-decoration: none; border: 1px solid transparent; }
        .btn-primary { background: #047857; color: #ffffff; }
        .btn-secondary { background: #ffffff; border-color: #cbd5e1; color: #1e293b; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2 style="font-size: 1.25rem; margin-bottom: 18px;" th:text="${isEdit ? 'Modifier le Medicament' : 'Nouveau Medicament'}">Medicament</h2>
        <form th:action="@{/medicaments/save}" th:object="${medicament}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label for="nom">Nom du medicament *</label>
                <input type="text" id="nom" th:field="*{nom}" class="form-control" required placeholder="Nom">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="2" placeholder="Description"></textarea>
            </div>
            <div class="form-group">
                <label for="prix">Prix (DH) *</label>
                <input type="number" step="0.01" id="prix" th:field="*{prix}" class="form-control" required placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="quantiteStock">Quantite en stock *</label>
                <input type="number" id="quantiteStock" th:field="*{quantiteStock}" class="form-control" required placeholder="Stock">
            </div>
            <div class="form-group">
                <label for="codeBarre">Code barre</label>
                <input type="text" id="codeBarre" th:field="*{codeBarre}" class="form-control" placeholder="Code barre">
            </div>
            <div class="btn-group">
                <a th:href="@{/medicaments}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Mettre a jour' : 'Enregistrer'}">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
