<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acces refuse - 403</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 36px 32px; max-width: 440px; text-align: center; }
        h1 { font-size: 2.5rem; font-weight: 700; color: #dc2626; margin-bottom: 8px; }
        h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; }
        p { font-size: 0.9rem; color: #64748b; line-height: 1.5; margin-bottom: 24px; }
        .btn { display: inline-block; padding: 10px 18px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; text-decoration: none; background-color: #047857; color: #ffffff; }
        .btn:hover { background-color: #065f46; }
    </style>
</head>
<body>
<div class="card">
    <h1>403</h1>
    <h2>Acces Refuse</h2>
    <p>Vous n'avez pas les autorisations necessaires pour acceder a cette ressource. Veuillez contacter l'administrateur ou revenir a l'accueil.</p>
    <a th:href="@{/home}" class="btn">Retour a l'accueil</a>
</div>
</body>
</html>
