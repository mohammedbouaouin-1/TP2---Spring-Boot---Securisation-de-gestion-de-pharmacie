<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Utilisateurs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; padding-bottom: 50px; }
        .navbar { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 14px 20px; margin-bottom: 25px; }
        .nav-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 22px; margin-bottom: 24px; }
        .card-header { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) auto; gap: 12px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.8rem; font-weight: 500; color: #475569; }
        .form-control { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.875rem; font-family: inherit; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border-radius: 6px; font-size: 0.875rem; font-weight: 500; text-decoration: none; cursor: pointer; border: 1px solid transparent; }
        .btn-primary { background-color: #047857; color: #ffffff; }
        .btn-primary:hover { background-color: #065f46; }
        .btn-secondary { background-color: #ffffff; border-color: #cbd5e1; color: #1e293b; }
        .btn-secondary:hover { background-color: #f1f5f9; }
        .btn-danger { background-color: #fef2f2; color: #dc2626; border-color: #fecaca; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px 16px; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        td { padding: 12px 16px; font-size: 0.875rem; border-bottom: 1px solid #e2e8f0; }
        .badge-role { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: #ecfdf5; color: #047857; margin-right: 4px; }
        .alert-success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 0.875rem; }
        .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 0.875rem; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-inner">
        <div><strong>Administration systeme</strong></div>
        <a th:href="@{/home}" class="btn btn-secondary">Retour a l'accueil</a>
    </div>
</nav>

<main class="container">
    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-header">Ajouter un utilisateur</div>
        <form th:action="@{/admin/users/save}" method="post" class="form-grid">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="Ex: agent1">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Mot de passe">
            </div>
            <div class="form-group">
                <label for="roleName">Role attribue</label>
                <select id="roleName" name="roleName" class="form-control" required>
                    <option th:each="r : ${roles}" th:value="${r.name}" th:text="${r.name}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Creer l'utilisateur</button>
        </form>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
        <div style="padding: 18px 22px; font-weight: 600; border-bottom: 1px solid #e2e8f0;">Liste des comptes utilisateurs</div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom d'utilisateur</th>
                    <th>Statut</th>
                    <th>Roles</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}">1</td>
                    <td><strong th:text="${u.username}">admin</strong></td>
                    <td><span th:text="${u.enabled ? 'Actif' : 'Inactif'}" style="font-size: 0.8rem; color: #047857;">Actif</span></td>
                    <td><span th:each="r : ${u.roles}" th:text="${r.name}" class="badge-role">ADMIN</span></td>
                    <td style="text-align: right;">
                        <a th:if="${u.username != 'admin'}" th:href="@{'/admin/users/delete/' + ${u.id}}" class="btn btn-danger"
                           onclick="return confirm('Confirmer la suppression de cet utilisateur ?');" style="padding: 4px 8px; font-size: 0.75rem;">Supprimer</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
